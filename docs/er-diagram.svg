<g id="legend" font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="60" y="860" font-size="11" fill="#4A5B6B">PK 主键    FK 外键    UK 唯一键    1 : N 一对多</text><text x="60" y="878" font-size="11" fill="#4A5B6B">主表：users、courses、course_sections、class_sessions、checkins；中间表：student_section_assignments</text><text x="60" y="896" font-size="11" fill="#7A6A55">注：created_by 字段均引用 users(id)，图中从略；checkin_status 由教师手动开启/关闭。</text></g>
